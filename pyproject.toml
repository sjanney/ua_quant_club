[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ua-quant-club"
version = "0.1.0"
description = "University of Arizona Quantitative Finance Club — alpha research and paper trading tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance",
    "pyarrow",
    "playwright",
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
    "jinja2",
    "weasyprint",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "execution*", "utils*", "reports*", "logging_*", "alphas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
